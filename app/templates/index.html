<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Geospatial File Measurement API</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/static/style.css?v=6" />
</head>
<body>
  <main>
    <div class="left-col">
      <section class="top">
        <h2>Upload &amp; File Info</h2>
        <form id="upload-form">
          <label class="file-picker" for="file-input">Choose file</label>
          <input id="file-input" type="file" accept=".kml,.zip" hidden />
          <span id="file-name" class="muted">No file selected (.kml or .zip)</span>
          <button id="upload-btn" type="submit">Upload</button>
        </form>
        <div id="file-meta"><dl class="meta-grid"><div class="meta-row"><dt>Status</dt><dd class="muted">No file uploaded yet.</dd></div></dl></div>
      </section>

      <section class="bottom">
        <h2>Features</h2>
        <div class="table-wrap">
          <table id="measure-table">
            <thead>
              <tr>
                <th>#</th><th>Type</th><th>CRS</th><th>Projected</th><th>Measure</th><th>Value</th><th>Unit</th>
              </tr>
            </thead>
            <tbody><tr><td colspan="7" class="muted">No data yet.</td></tr></tbody>
          </table>
        </div>

        <ul id="activity" class="mono" hidden></ul>
      </section>
    </div>

    <section class="map-panel">
      <div id="map"></div>
      <p class="hint">Polygons: blue &middot; Lines: orange &middot; Points: red. Click a feature for properties + measurement.</p>
    </section>
  </main>

  <div id="upload-status" class="toast" role="status" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/static/app.js?v=6"></script>
</body>
</html>
